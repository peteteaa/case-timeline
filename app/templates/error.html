{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{% if code == 404 %}Not found{% elif code == 422 %}That didn’t work{% elif code == 403 %}Not allowed{% else %}Something went wrong{% endif %}</h1>
  <p>{{ detail }}</p>
  <p><a href="/cases/{{ quote(case_id) }}/facts">Back to the timeline</a></p>
</section>
{% endblock %}
