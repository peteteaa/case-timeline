[project]
name = "case-timeline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "openai>=1.50",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "dateparser>=1.2",
  "python-dateutil>=2.9",
  "rapidfuzz>=3.9",
  "sqlite-vec>=0.1.6",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "mcp>=1.2",
  "filelock>=3.15",
  "openpyxl>=3.1.5",
  "cairosvg>=2.9.1",
]

[project.optional-dependencies]
docling = ["docling>=2.0"]
embed = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.8", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: requires the local vLLM server on 127.0.0.1:8000"]
addopts = "-m 'not llm'"

[tool.setuptools]
packages = ["pipeline", "mcp_server", "app", "eval"]
